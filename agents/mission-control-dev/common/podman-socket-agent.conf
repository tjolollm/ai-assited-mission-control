# The agent user's access to Podman's socket, as agentd's own drop-in gives it. agentd writes that drop-in only once
# the agent boots and then runs `systemctl enable --now podman.socket`, which leaves a socket that sockets.target
# already started owned by root alone, so kind and cloud-provider-kind are refused. With this, the socket has the
# agent group from the first boot on.
[Socket]
DirectoryMode=0755
SocketGroup=agent
SocketMode=0660
