# The Mission Control architect agent: grills its user on a design, records the decisions as MADR ADRs in docs/adr/
# and creates GitHub issues an implementing agent can build without guessing, on a checkout of
# ai-assited-mission-control. Apply it from this directory with `agentctl apply --wait`.
apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: mission-control-architect
spec:
  sandbox:
    # Published by .github/workflows/mission-control-architect-image.yml from ../Dockerfile on every push to main.
    image:
      type: reference
      reference: ghcr.io/tjolollm/ai-assited-mission-control/mission-control-architect-minimal:latest
    platform:
      os: linux
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        # The checkout and its worktrees, with room for one nested agent's image and disk.
        capacity: "48Gi"
        mode: direct
      # To try changes to this agent's own definition in a nested agent. A host without nested KVM starts the agent
      # without them.
      nestedSandboxes: preferred
    initSystem: image
  instructions:
    - source: ../instructions.md
    - source: environment.md
    - source: ../improving.md
  skills:
    # This repository's own.
    - source: ../skills/madr-adr
    - source: ../skills/agent-ready-issue
    # Pinned copies from mattpocock/skills, as ../skills/VENDORED.md describes.
    - source: ../skills/grill-me
    - source: ../skills/grilling
    - source: ../skills/grill-with-docs
    - source: ../skills/domain-modeling
    - source: ../skills/to-spec
    - source: ../skills/to-tickets
    - source: ../skills/writing-for-agents
    - source: ../skills/setup-matt-pocock-skills
  harnesses:
    - type: claudeCode
      default: true
      # Whichever login you stored, whatever its name. Name one in your variant, such as `login: work`, to keep the
      # agent on it.
      login: any
    # The agent starts without Codex when the host has no Codex login. `agentctl codex login` adds it on the next
    # reconcile.
    - type: codex
      login: any
      optional: true
  # GITHUB_TOKEN and Git's name and email, from `agentctl github login default`. The agent pushes ADR branches, opens
  # their pull requests and creates issues as this account.
  accounts:
    - type: github
      login: default
  access:
    - type: ssh
  # A grilling session reads the documentation of whatever a decision weighs, so the agent reaches every host but the
  # cloud metadata service.
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
