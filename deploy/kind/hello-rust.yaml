apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-rust
  labels:
    app: hello-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-rust
  template:
    metadata:
      labels:
        app: hello-rust
    spec:
      containers:
        - name: hello-rust
          # Built locally and loaded with `kind load docker-image`; Podman names local images localhost/<name>.
          image: localhost/hello-rust:e2e
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: hello-rust
  labels:
    app: hello-rust
spec:
  type: LoadBalancer
  selector:
    app: hello-rust
  ports:
    - name: http
      port: 80
      targetPort: http
