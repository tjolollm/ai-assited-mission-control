apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-rust
  labels:
    app: hello-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-rust
  template:
    metadata:
      labels:
        app: hello-rust
    spec:
      containers:
        - name: hello-rust
          # Built locally and loaded with `kind load docker-image`; Podman names local images localhost/<name>.
          # hack/e2e-kind.sh replaces the tag with one unique to each build.
          image: localhost/hello-rust:e2e
          imagePullPolicy: Never
          lifecycle:
            # Keep serving for 5s after the pod is marked for deletion, while kube-proxy and the LoadBalancer stop
            # sending it new connections; only then does SIGTERM start the app's own shutdown. Without this, rollouts
            # dropped about 1% of requests. sleep, not exec: the distroless image has no shell. 5s plus the app's 10s
            # shutdown grace fits the default terminationGracePeriodSeconds of 30.
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: hello-rust
  labels:
    app: hello-rust
spec:
  type: LoadBalancer
  selector:
    app: hello-rust
  ports:
    - name: http
      port: 80
      targetPort: http
