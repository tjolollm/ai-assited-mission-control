[package]
name = "hello-rust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
